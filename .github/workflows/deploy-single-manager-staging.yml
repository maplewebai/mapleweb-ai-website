name: Deploy one MapleWeb Manager to isolated Cloudflare staging

on:
  workflow_dispatch:
  push:
    branches: [mapleweb-ai-agents]
    paths: ['agents/manager/REQUEST_SINGLE_STAGING_DEPLOY.md']

permissions:
  contents: read

concurrency:
  group: mapleweb-single-manager-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/mapleweb-ai-agents'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_ACCOUNT_ID: ${{ vars.MAPLEWEB_STAGING_CLOUDFLARE_ACCOUNT_ID }}
      STAGING_D1_ID: ${{ secrets.MAPLEWEB_STAGING_D1_DATABASE_ID }}
      OWNER_TOKEN: ${{ secrets.MAPLEWEB_STAGING_OWNER_TOKEN }}
      FREE_TIER_VERIFIED: ${{ vars.MAPLEWEB_STAGING_FREE_CONFIRMED }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mapleweb-ai-agents
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test single Manager source (never deploy nine role Workers)
        working-directory: agents/manager
        run: |
          npm test
          npm run check
      - name: Verify owner, staging secrets, free-tier confirmation and isolated resources
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID EXPECTED_ACCOUNT_ID STAGING_D1_ID OWNER_TOKEN; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required staging setting: $key"
              exit 1
            fi
          done
          if [ "$FREE_TIER_VERIFIED" != "CONFIRMED_FREE_TIER" ]; then
            echo "::error::Free-tier / no-charge staging resources have not been confirmed by the owner."
            exit 1
          fi
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]] ||
             [ "$CLOUDFLARE_ACCOUNT_ID" != "$EXPECTED_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare account identity mismatch or invalid ID."
            exit 1
          fi
          if [ "${#OWNER_TOKEN}" -lt 32 ]; then
            echo "::error::Staging owner token must contain at least 32 characters."
            exit 1
          fi
          if ! [[ "$STAGING_D1_ID" =~ ^[a-fA-F0-9-]{36}$ ]]; then
            echo "::error::Staging D1 database ID has an invalid format."
            exit 1
          fi
          account_status=$(curl --silent --show-error --output /tmp/mapleweb-cf-account.json --write-out '%{http_code}' --connect-timeout 10 --max-time 25 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")
          if [ "$account_status" != 200 ] ||
             ! jq -e --arg id "$CLOUDFLARE_ACCOUNT_ID" '.success == true and .result.id == $id' /tmp/mapleweb-cf-account.json >/dev/null; then
            echo "::error::Cloudflare account authorization was not verified."
            exit 1
          fi
          db_status=$(curl --silent --show-error --output /tmp/mapleweb-staging-db.json --write-out '%{http_code}' --connect-timeout 10 --max-time 25 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$STAGING_D1_ID")
          if [ "$db_status" != 200 ] ||
             ! jq -e --arg id "$STAGING_D1_ID" '.success == true and .result.uuid == $id and .result.name == "mapleweb-manager-staging-db"' /tmp/mapleweb-staging-db.json >/dev/null; then
            echo "::error::Verified dedicated staging D1 database not found; refusing production DB."
            exit 1
          fi
          worker_status=$(curl --silent --show-error --output /tmp/mapleweb-staging-worker.json --write-out '%{http_code}' --connect-timeout 10 --max-time 25 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/mapleweb-manager-v2-staging")
          if [ "$worker_status" != 404 ]; then
            echo "::error::Staging Worker name already exists or cannot be checked; refusing overwrite."
            exit 1
          fi
          echo "Verified isolated Cloudflare account, staging DB, unused Worker name and owner's no-charge confirmation."
      - name: Build ephemeral isolated Manager config
        shell: bash
        working-directory: agents/manager
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cfg = {
            name:'mapleweb-manager-v2-staging',
            main:'./src/worker.mjs',
            compatibility_date:'2026-11-01',
            workers_dev:true,
            vars:{MODE:'staging',BUSINESS_CASES_ENABLED:'true'},
            d1_databases:[{
              binding:'DB',
              database_name:'mapleweb-manager-staging-db',
              database_id:process.env.STAGING_D1_ID,
              migrations_dir:'./migrations'
            }]
          };
          if(cfg.routes || cfg.route) throw Error('Public routes prohibited');
          fs.writeFileSync('.workflow-single-staging.jsonc',JSON.stringify(cfg,null,2));
          NODE
      - name: Validate Wrangler bundle without deployment
        working-directory: agents/manager
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --config .workflow-single-staging.jsonc
      - name: Apply migrations to preverified staging database only
        working-directory: agents/manager
        run: npx wrangler d1 migrations apply mapleweb-manager-staging-db --remote --yes --config .workflow-single-staging.jsonc
      - name: Deploy single isolated Manager Worker (no routes or customer sites)
        working-directory: agents/manager
        run: npx wrangler deploy --config .workflow-single-staging.jsonc
      - name: Save owner token as Cloudflare encrypted Worker secret
        working-directory: agents/manager
        shell: bash
        run: printf '%s' "$OWNER_TOKEN" | npx wrangler secret put MANAGER_OWNER_TOKEN --name mapleweb-manager-v2-staging
      - name: Report scope
        if: always()
        run: |
          echo "Single-Manager staging workflow only. No eight role Workers, no HQ deployment, no Stripe live charges, no main edits." >> "$GITHUB_STEP_SUMMARY"
