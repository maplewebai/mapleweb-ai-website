name: RETIRED - legacy nine-Worker staging deployment (NO DEPLOY)
on:
  workflow_dispatch:
  push:
    branches: [mapleweb-ai-agents]
    paths:
      - 'agents/ACTIVATE_STAGING_APPROVED.md'

permissions:
  contents: read

jobs:
  retired:
    if: github.ref == 'refs/heads/mapleweb-ai-agents'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report replacement plan; do not deploy
        run: |
          echo "::notice::Legacy nine-Worker architecture is retired. No deployment attempted."
          echo "### MapleWeb 2.0 — old deployment retired" >> "$GITHUB_STEP_SUMMARY"
          echo "The old eight-role + Manager Worker deployment has been disabled." >> "$GITHUB_STEP_SUMMARY"
          echo "Review docs/MAPLEWEB_KIMI_LEAN_V2_PLAN.md on mapleweb-ai-agents." >> "$GITHUB_STEP_SUMMARY"
          echo "No Cloudflare authorization, API calls, writes, paid usage or public site changes." >> "$GITHUB_STEP_SUMMARY"
