name: Verify live Headquarters mobile install prerequisites (no deploy)
on:
  workflow_dispatch:
  push:
    branches: [mapleweb-ai-agents]
    paths:
      - 'tools/qa/verify-hq-install.mjs'
      - '.github/workflows/verify-hq-install.yml'
permissions:
  contents: read
jobs:
  installation:
    if: github.ref == 'refs/heads/mapleweb-ai-agents'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HQ_BUILD: afe1349cf8aa8453f741564fdb760562d3230fea
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tools/qa/verify-hq-install.mjs
      - if: always()
        run: echo "This tests mobile browser emulation, not actual phone home-screen installation. No account secrets, deployments or paid services." >> "$GITHUB_STEP_SUMMARY"
