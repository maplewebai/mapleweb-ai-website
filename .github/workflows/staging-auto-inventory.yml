name: MapleWeb AI automatic Cloudflare inventory (READ ONLY; NO DEPLOY)

on:
  workflow_dispatch:
  push:
    branches: [mapleweb-ai-agents]
    paths:
      - 'agents/RUN_STAGING_AUTO_INVENTORY.md'
      - '.github/workflows/staging-auto-inventory.yml'
      - 'agents/cloudflare-inventory.mjs'
      - 'agents/tests/cloudflare-inventory.test.mjs'

permissions:
  contents: read

concurrency:
  group: mapleweb-staging-auto-inventory
  cancel-in-progress: true

jobs:
  inventory:
    if: github.ref == 'refs/heads/mapleweb-ai-agents'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test read-only safeguards (synthetic; no Cloudflare access)
        run: |
          node --check agents/cloudflare-inventory.mjs
          node --test agents/tests/cloudflare-inventory.test.mjs
      - name: Report which Cloudflare settings are available to this job
        env:
          CANONICAL_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          SCREENSHOT_TOKEN_PRESENT: ${{ secrets.CLAUDFLAER_API_TOKEN != '' }}
          LEGACY_TOKEN_PRESENT: ${{ secrets.CLOUDFLAER_API_TOKEN != '' }}
          ACCOUNT_ID_PRESENT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          STAGING_ACCOUNT_PRESENT: ${{ vars.MAPLEWEB_STAGING_CLOUDFLARE_ACCOUNT_ID != '' }}
          STAGING_D1_PRESENT: ${{ secrets.MAPLEWEB_STAGING_D1_DATABASE_ID != '' }}
          STAGING_OWNER_TOKEN_PRESENT: ${{ secrets.MAPLEWEB_STAGING_OWNER_TOKEN != '' }}
          CALLING_D1_PRESENT: ${{ secrets.MAPLEWEB_STAGING_CALLING_D1_DATABASE_ID != '' }}
          CALLING_ADMIN_PRESENT: ${{ secrets.MAPLEWEB_STAGING_CALLING_ADMIN_TOKEN != '' }}
          CALLING_HASH_PRESENT: ${{ secrets.MAPLEWEB_STAGING_CALLING_HASH_SECRET != '' }}
          FREE_CONFIRMED: ${{ vars.MAPLEWEB_STAGING_FREE_CONFIRMED == 'CONFIRMED_FREE_TIER' }}
          CALLING_APPROVED: ${{ vars.MAPLEWEB_STAGING_CALLING_DEPLOY_APPROVED == 'APPROVED_ISOLATED_STAGING_NO_CALLS' }}
        run: |
          {
            echo '### GitHub Actions settings available to this job'
            echo "- CLOUDFLARE_API_TOKEN: $CANONICAL_TOKEN_PRESENT"
            echo "- CLAUDFLAER_API_TOKEN: $SCREENSHOT_TOKEN_PRESENT"
            echo "- CLOUDFLAER_API_TOKEN: $LEGACY_TOKEN_PRESENT"
            echo "- CLOUDFLARE_ACCOUNT_ID: $ACCOUNT_ID_PRESENT"
            echo "- MAPLEWEB_STAGING_CLOUDFLARE_ACCOUNT_ID (variable): $STAGING_ACCOUNT_PRESENT"
            echo "- MAPLEWEB_STAGING_D1_DATABASE_ID: $STAGING_D1_PRESENT"
            echo "- MAPLEWEB_STAGING_OWNER_TOKEN: $STAGING_OWNER_TOKEN_PRESENT"
            echo "- MAPLEWEB_STAGING_CALLING_D1_DATABASE_ID: $CALLING_D1_PRESENT"
            echo "- MAPLEWEB_STAGING_CALLING_ADMIN_TOKEN: $CALLING_ADMIN_PRESENT"
            echo "- MAPLEWEB_STAGING_CALLING_HASH_SECRET: $CALLING_HASH_PRESENT"
            echo "- MAPLEWEB_STAGING_FREE_CONFIRMED (confirmation matches): $FREE_CONFIRMED"
            echo "- MAPLEWEB_STAGING_CALLING_DEPLOY_APPROVED (approval matches): $CALLING_APPROVED"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify Cloudflare account and inspect both staging services (GET only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLAUDFLAER_API_TOKEN || secrets.CLOUDFLAER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.MAPLEWEB_STAGING_CLOUDFLARE_ACCOUNT_ID }}
          MANAGER_D1_ID: ${{ secrets.MAPLEWEB_STAGING_D1_DATABASE_ID }}
          CALLING_D1_ID: ${{ secrets.MAPLEWEB_STAGING_CALLING_D1_DATABASE_ID }}
        run: |
          node agents/cloudflare-inventory.mjs
      - name: Always document that this workflow does NOT deploy
        if: always()
        run: |
          echo "This workflow never creates Workers, databases, routes or payments." >> "$GITHUB_STEP_SUMMARY"
