name: Test rebuilt Manager (no deploy)
on:
  push:
    branches: [mapleweb-ai-agents]
    paths: ['agents/manager/**', '.github/workflows/test-manager-rebuild.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: agents/manager
