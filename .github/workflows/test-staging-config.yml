name: Verify nine staging Worker configs (NO DEPLOY)
on:
  push:
    branches: [mapleweb-ai-agents]
    paths:
      - 'agents/generate-staging-config.mjs'
      - '.github/workflows/activate-mapleweb-staging.yml'
      - '.github/workflows/test-staging-config.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/mapleweb-ai-agents'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate configs using fake staging IDs (no credentials)
        env:
          MAPLEWEB_STAGING_WORKERS_SUBDOMAIN: fake-staging.workers.dev
          MAPLEWEB_STAGING_D1_DATABASE_ID: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
        run: node agents/generate-staging-config.mjs
      - name: Check isolated naming, D1 binding and all eight endpoints
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {ROLES} from './agents/manager/src/roles.mjs';
          const m=JSON.parse(fs.readFileSync('agents/manager/.generated-staging.json','utf8'));
          assert.equal(m.name,'mapleweb-manager-rebuilt-staging');
          assert.equal(m.d1_databases[0].database_name,'mapleweb-manager-staging-db');
          assert.equal(m.d1_databases[0].database_id,'aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee');
          const h=JSON.parse(m.vars.AGENT_HEALTH_URLS);
          const e=JSON.parse(m.vars.AGENT_EXECUTION_URLS);
          assert.equal(Object.keys(h).length,8);
          assert.equal(Object.keys(e).length,8);
          for(const role of ROLES){
            const config=JSON.parse(fs.readFileSync('agents/roles/.generated-'+role+'.json','utf8'));
            assert.equal(config.vars.ROLE_NAME,role);
            assert.equal(config.name,'mapleweb-agent-'+role+'-staging');
            assert.equal(h[role], 'https://'+config.name+'.fake-staging.workers.dev/health');
            assert.equal(e[role], 'https://'+config.name+'.fake-staging.workers.dev/execute');
            assert.equal(config.workers_dev,true);
          }
          console.log('All nine staging configs verified. No cloud connections or deployments.');
          NODE
